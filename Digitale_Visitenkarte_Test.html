<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Digitale Visitenkarte – Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#101827,#263957);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:#182337;display:grid;place-items:center;padding:22px}.card{width:min(100%,420px);background:#fff;border-radius:24px;padding:36px 28px;box-shadow:0 20px 70px #0005;text-align:center}.avatar{width:78px;height:78px;border-radius:50%;background:#e7efff;color:#244b9a;display:grid;place-items:center;font-size:29px;font-weight:700;margin:auto auto 18px}h1{font-size:28px;margin:0 0 5px}.sub{color:#607086;margin:0 0 25px}.info{text-align:left;background:#f5f7fa;padding:18px;border-radius:14px;margin-bottom:22px}.info p{margin:8px 0;overflow-wrap:anywhere}.info a{color:#2456a4;text-decoration:none}.button{display:block;border:0;width:100%;padding:16px;border-radius:13px;background:#2058b8;color:white;font-weight:700;font-size:17px;cursor:pointer;text-decoration:none}.note{font-size:13px;color:#66758a;line-height:1.5;margin:18px 0 0}</style></head><body><main class="card"><div class="avatar">MM</div><h1>Max Mustermann</h1><p class="sub">Musterfirma · Geschäftsführer</p><div class="info"><p>📞 <a href="tel:+491701234567">+49 170 1234567</a></p><p>✉️ <a href="mailto:max@beispiel.de">max@beispiel.de</a></p><p>🌐 <a href="https://example.com">example.com</a></p></div><button class="button" id="save">Kontakt speichern</button><p class="note">Test-Visitenkarte mit Beispieldaten. Nach dem Tippen die Kontaktdatei öffnen und zum Adressbuch hinzufügen.</p></main><script>document.getElementById('save').addEventListener('click',()=>{const vcard=['BEGIN:VCARD','VERSION:3.0','N:Mustermann;Max;;;','FN:Max Mustermann','ORG:Musterfirma','TITLE:Geschäftsführer','TEL;TYPE=WORK,CELL:+491701234567','EMAIL;TYPE=WORK:max@beispiel.de','URL:https://example.com','END:VCARD'].join('\r\n');const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Max_Mustermann.vcf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)});</script></body></html>
